apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-1
  namespace: voting-app-test
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: origin #dato che il provisioner di questa classe é quella di default di crc creerà il pv subito siccome bindingMode: immediate
