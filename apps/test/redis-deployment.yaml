apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-vote-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-vote-back
  template:
    metadata:
      labels:
        app: azure-vote-back
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      initContainers:
        - name: volume-permissions
          image: busybox:latest
          # Cambia ownership della cartella all'utente 1001 (Redis)
          command: ['sh', '-c', 'chown -R 1001:1001 /bitnami/redis/data']
          securityContext:
            runAsUser: 0 # Questo gira come Root
          volumeMounts:
            - mountPath: /bitnami/redis/data
              name: redis-data-storage
      containers:
      - name: azure-vote-back
        image: mcr.microsoft.com/oss/bitnami/redis:6.0.8
        env:
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        ports:
        - containerPort: 6379
          name: redis
          name: redis
        volumeMounts:
        - name: redis-data-storage
          mountPath: /bitnami/redis/data
      volumes:
      - name: redis-data-storage
        persistentVolumeClaim:
          claimName: pvc-1
---
apiVersion: v1
kind: Service
metadata:
  name: azure-vote-back
spec:
  ports:
  - port: 6379
  selector:
    app: azure-vote-back


