apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-anyuid-scc
  # il namespace lo decide Argo CD
subjects:
  - kind: ServiceAccount
    name: default
    # per il namespace applica quello corrente
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
