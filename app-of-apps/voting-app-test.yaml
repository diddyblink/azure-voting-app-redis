apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/diddyblink/azure-voting-app-redis.git
    targetRevision: Openshift_Argo  
    path: apps/test                     
  destination:
    server: https://kubernetes.default.svc
    namespace: voting-app-test        
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true          
