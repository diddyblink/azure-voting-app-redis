apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-vote-front
  name: configmap-demo-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-vote-front
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5 
  template:
    metadata:
      labels:
        app: azure-vote-front
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: azure-vote-front
        image: diddyblink/azure-vote-front:v1
        imagePullPolicy: Always
        command: [ "/bin/sh", "-c", "env" ]
        envFrom:
        - configMapKeyRef:
            name: vote-values
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 250m
          limits:
            cpu: 500m
        env:
        - name: REDIS
          value: "azure-vote-back"
---
apiVersion: v1
kind: Service
metadata:
  name: azure-vote-front
spec:
  type: NodePort
  ports:
  - port: 80
  selector:
    app: azure-vote-front
