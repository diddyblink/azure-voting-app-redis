name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # O il nome del tuo branch se diverso
    paths:
      - 'azure-vote/**' # Parte solo se tocchi il codice dell'app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Login su Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push dell'immagine
        uses: docker/build-push-action@v4
        with:
          context: ./azure-vote # Cartella dove sta il Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/azure-vote-front:latest,${{ secrets.DOCKER_USERNAME }}/azure-vote-front:${{ github.sha }}
