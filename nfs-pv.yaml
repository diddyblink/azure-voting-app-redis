apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-local
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  nfs:
    server: 10.52.1.209     # L'IP che ha risposto al showmount
    path: /var/nfs          # Il path nell'export list (definito nel nfs.config)
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: nfs-pv-local
